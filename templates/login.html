
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Administrativo</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fce8f1, #eee5f7);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 38px;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(84, 50, 105, 0.13);
        }

        .login-logo {
            width: 65px;
            height: 65px;
            border-radius: 20px;
            background: #fce8f1;
            color: #ad477c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .login-card h1 {
            text-align: center;
            color: #543269;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-card p {
            text-align: center;
            color: #887b8d;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .login-card label {
            display: block;
            color: #493d4e;
            font-weight: 600;
            margin: 16px 0 7px;
        }

        .login-card input {
            width: 100%;
            padding: 13px;
            border: 1px solid #eaddea;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-card button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #75458e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-card button:hover {
            background: #543269;
        }

        .erro {
            background: #fff0f0;
            color: #b42318;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #75458e;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="login-logo">M+</div>

        <h1>Acesso administrativo</h1>
        <p>
            Mulheres, Maternidade e Mercado de Trabalho:
            Igualdade de Oportunidades e Discriminação Profissional
        </p>

        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <form action="/login" method="post">
            <label for="usuario">Usuário</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">Entrar no painel</button>
        </form>

        <a href="/" class="voltar">Voltar ao início</a>
    </main>
</body>
</html>
